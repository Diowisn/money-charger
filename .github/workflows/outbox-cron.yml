name: Process WhatsApp queues

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Drain pending replies
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_BASE_URL and CRON_SECRET repository secrets to enable outbox retries."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 25 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/outbox"
